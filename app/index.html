<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah's World</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="sun">☀️</div>
<div class="cloud">☁️</div>

<div class="container">

        <h1>🌱 Noah's World</h1>

        <h2>Today's Adventure</h2>
          <p id="progress">0 / 4 completed</p>

        <button onclick="completeTask(this, 'garden')">
            💧 Water the Garden
        </button>

        <button onclick="completeTask(this, 'pyjamas')">
            👕 Put on Pyjamas
        </button>

      <button onclick="completeTask(this, 'teeth')">
            🦷 Brush your Teeth
        </button>

        <button onclick="completeTask(this, 'bed')">
            🛏️ Hop into Bed
        </button>

        <p id="message">
            Welcome Noah! Let's begin today's adventure.
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
