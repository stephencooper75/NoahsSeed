<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Noah's Seed</title>

    <link rel="stylesheet"
          href="css/style.css">



<!-- ===================================================== -->
<!-- Noah's Seed Branding -->
<!-- ===================================================== -->

<link rel="icon"
      type="image/png"
      sizes="32x32"
      href="branding/favicon-32.png">

<link rel="icon"
      type="image/png"
      sizes="16x16"
      href="branding/favicon-16.png">

<link rel="icon"
      type="image/svg+xml"
      href="branding/favicon.svg">

<link rel="shortcut icon"
      type="image/x-icon"
      href="branding/favicon.ico">

<link rel="apple-touch-icon"
      sizes="180x180"
      href="branding/apple-touch-icon.png">

<!-- Android / PWA -->

<link rel="manifest"
      href="manifest.json">

<meta name="theme-color"
      content="#4CAF50">

<meta name="mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<meta name="apple-mobile-web-app-title"
      content="Noah's Seed">

</head>

<body>

    <!-- ===================================================== -->
    <!-- Background -->
    <!-- ===================================================== -->

    <div class="sun">☀️</div>

    <div class="cloud">☁️</div>


    <!-- ===================================================== -->
    <!-- Experience Window -->
    <!-- ===================================================== -->

    <div id="experienceWindow"
         style="
            display:none;
            position:fixed;
            left:50%;
            top:50%;
            transform:translate(-50%,-50%);
            background:white;
            padding:30px;
            border:3px solid black;
            border-radius:15px;
            z-index:99999;
            min-width:400px;
            min-height:250px;
            box-shadow:0 10px 30px rgba(0,0,0,.35);
         ">
    </div>


    <!-- ===================================================== -->
    <!-- Welcome Screen -->
    <!-- ===================================================== -->

    <div id="welcomeScreen"
         class="container">

       <img
    src="branding/logo-horizontal.png"
    alt="Noah's Seed"
    class="gameLogo">

        <h2>Welcome!</h2>

        <p>
            A fun world made especially for Noah.
        </p>

        <button id="startButton">
            🌻 Start Adventure
        </button>

        <br><br>

<button id="spaceInvadersButton">
    👾 Space Invaders
</button>

    </div>


    <!-- ===================================================== -->
    <!-- Location Screen -->
    <!-- ===================================================== -->

    <div id="locationScreen"
         class="container hidden">

       <img
    src="branding/logo-horizontal.png"
    alt="Noah's Seed"
    class="gameLogo">

        <h2>Choose your adventure</h2>

        <div id="locations"></div>

    </div>


    <!-- ===================================================== -->
    <!-- Game Screen -->
    <!-- ===================================================== -->

    <div id="gameScreen"
         class="container hidden">

<img
    src="branding/logo-horizontal.png"
    alt="Noah's Seed"
    class="gameLogo">

        <div id="locationInfo"></div>

        <div id="progressDisplay">

            🌱 Nature Progress

            <br>

            ⭐ XP: 0

            <br>

            🏆 Activities completed: 0

        </div>

        <div id="message">

            Welcome Noah!
            Let's begin today's adventure.

        </div>

        <div id="generatedActivities"></div>

    </div>


    <!-- ===================================================== -->
    <!-- Garden -->
    <!-- ===================================================== -->

    <div id="gardenScreen"
         class="container hidden">

      <img
    src="branding/logo-horizontal.png"
    alt="Noah's Seed"
    class="gameLogo">

<div id="gardenView"></div>

        <br>

        <button id="backToGameButton">

            ⬅ Back to Activities

        </button>

    </div>


    <!-- ===================================================== -->
    <!-- Debug -->
    <!-- ===================================================== -->

    <div id="debugOverlay"
         style="
            position:fixed;
            top:10px;
            right:10px;
            background:rgba(0,0,0,.75);
            color:white;
            padding:10px;
            border-radius:10px;
            font-family:monospace;
            font-size:13px;
            z-index:9999;">

        Loading...

    </div>


    <!-- ===================================================== -->
    <!-- Engine -->
    <!-- ===================================================== -->

    <script src="engine/capabilities/Capability.js"></script>

    <script src="app/core/Registry.js"></script>

 

    <script src="content/dialogue/companions.js"></script>

    <script src="content/dialogue/discoveries.js"></script>

<script src="app/systems/CompanionSystem.js"></script>

<script src="app/systems/JournalSystem.js"></script>



    <!-- ===================================================== -->
    <!-- Core -->
    <!-- ===================================================== -->

    <script src="app/core/EventBus.js"></script>
    <script src="app/core/WorldState.js"></script>
    <script src="app/core/WorldClock.js"></script>
    <script src="app/core/GameLoop.js"></script>
    <script src="app/core/SaveSystem.js"></script>
    <script src="app/core/ContentLoader.js"></script>
    <script src="app/core/managers/ContentManager.js"></script>
    <script src="app/core/managers/SystemManager.js"></script>


    <!-- ===================================================== -->
    <!-- Content -->
    <!-- ===================================================== -->

    <script src="app/data/activities.js"></script>

    <script src="content/rewards/rewards.js"></script>

    <script src="content/achievements/achievements.js"></script>

    <script src="content/plants/plants.js"></script>

    <script src="app/data/activities/activityLibrary.js"></script>

    <script src="app/data/worlds/noahsWorld.js"></script>


    <!-- ===================================================== -->
    <!-- Systems -->
    <!-- ===================================================== -->

    <script src="app/systems/NavigationSystem.js"></script>

    <script src="app/systems/WorldSystem.js"></script>

    <script src="app/systems/LocationSystem.js"></script>

    <script src="app/systems/ProgressSystem.js"></script>

    <script src="app/systems/RewardSystem.js"></script>

  <script src="content/nature/ambientEvents.js"></script>

<script src="app/systems/NatureSystem.js"></script>

<script src="app/systems/DiscoverySystem.js"></script>

    <script src="app/systems/AchievementSystem.js"></script>

    <script src="app/core/entities/Entity.js"></script>

    <script src="app/core/world/Tile.js"></script>

    <script src="app/core/Activity.js"></script>

    <script src="app/systems/EntitySystem.js"></script>

    <script src="app/systems/TileSystem.js"></script>

    <script src="app/systems/ActivitySystem.js"></script>

    <script src="app/systems/SimulationSystem.js"></script>

    <script src="app/systems/simulation/PlantSimulation.js"></script>


    <!-- ===================================================== -->
    <!-- Presentation -->
    <!-- ===================================================== -->

    <script src="app/presentation/GardenRenderer.js"></script>

    <script src="app/debug/DebugOverlay.js"></script>

<script src="app/Game.js"></script>

</body>

</html>
