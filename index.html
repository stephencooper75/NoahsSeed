<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah's Seed</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="sun">☀️</div>
<div class="cloud">☁️</div>

<!-- Welcome Screen -->

<div id="welcomeScreen" class="container">

    <h1>🌱 Noah's World</h1>

    <h2>Welcome!</h2>

    <p>
        A fun world made especially for Noah.
    </p>

    <button id="startButton">
        🌻 Start Adventure
    </button>

</div>


<!-- Location Screen -->

<div id="locationScreen" class="container hidden">

    <h1>🌱 Noah's World</h1>

    <h2>Choose your adventure</h2>

    <div id="locations"></div>

</div>


<!-- Game Screen -->

<div id="gameScreen" class="container hidden">

    <h1>🌱 Noah's World</h1>

    <h2>Today's Adventure</h2>

    <p id="progress">0 / 4 completed</p>

    <div id="generatedActivities"></div>

    <p id="message">
        Welcome Noah! Let's begin today's adventure.
    </p>

</div>

</div>

<script src="app/core/EventBus.js"></script>
<script src="app/core/Registry.js"></script>

<script src="app/data/activities.js"></script>
<script src="app/data/worlds/noahsWorld.js"></script>

<script src="app/systems/NavigationSystem.js"></script>
<script src="app/systems/WorldSystem.js"></script>
<script src="app/systems/LocationSystem.js"></script>

<script src="app/engine.js"></script>

</body>
</html>
